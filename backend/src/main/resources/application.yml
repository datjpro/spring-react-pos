spring:
  application:
    name: pos-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  security:
    jwt:
      secret: 0123456789012345678901234567890101234567890123456789012345678901
      access-token-expiration-ms: 3600000
      refresh-token-expiration-ms: 604800000

  bootstrap:
    admin:
      enabled: true
      username: admin
      password: postgres
      role: ADMIN

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
